# DisplayServer=wayland with no CompositorCommand override uses SDDM's own
# documented, tested default backend (weston --shell=fullscreen-shell.so) to
# host the QML greeter. CompositorCommand=Hyprland was evaluated and
# rejected: real-world reports (Arch forums thread #289612) show it
# sometimes renders only the wallpaper with no greeter window - a regression
# class this fork does not want to reintroduce into the login path after
# the kmscon/VT1 debugging already documented in ROADMAP.md. cage was also
# considered but has no confirmed working SDDM precedent (unlike its common
# use as a greetd/ReGreet host, which is a different codepath). weston is
# the one combination SDDM's own docs describe as the default, tested path.
[General]
DisplayServer=wayland
Numlock=on

[Wayland]
# Only the hyde-sessions dir is scanned - see installer/setup-sddm.sh for how
# it's populated (a symlink to the packaged hyprland-uwsm.desktop, never a
# copy) and docs/personal-fork/ROADMAP.md for why the other two
# /usr/share/wayland-sessions/*.desktop entries (plain hyprland.desktop,
# plasma.desktop) are filtered out this way instead of touched/deleted.
SessionDir=/etc/sddm/hyde-sessions
# libxkbcommon's generic default-layout env vars; honoured by weston (and
# most Wayland compositors) when no explicit XKB rules are configured.
# Known SDDM/Wayland-greeter caveat (sddm/sddm#1528): layout selection can
# still fall back to US on some setups - verify at first real boot, not
# just assumed from this config.
GreeterEnvironment=XKB_DEFAULT_LAYOUT=fr
