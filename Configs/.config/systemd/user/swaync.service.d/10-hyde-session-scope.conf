# HyDE: scope SwayNC's own systemd unit (and, more importantly, its
# org.erikreider.swaync.service D-Bus activation - see
# /usr/share/dbus-1/services/org.erikreider.swaync.service, a package file
# this fork does not own or edit) to the Hyprland session only.
#
# Without this, ANY desktop notification request (from any session) makes
# dbus-daemon D-Bus-activate swaync.service - even though the unit's own
# [Install] WantedBy=graphical-session.target is left disabled, D-Bus
# activation bypasses that entirely. Under a Plasma session this races
# against org.kde.plasma.Notifications.service for the org.freedesktop.
# Notifications bus name, loses the "Could not acquire notification name"
# race, exit(1)s, gets restarted 5x in under a second by the vendor unit's
# Restart=on-failure, and hits systemd's start-limit-hit - all while Plasma
# already owns notifications correctly. See docs/personal-fork/ARCHITECTURE.md.
#
# ConditionEnvironment reads systemd --user's OWN activation environment
# (imported at session start via dbus-update-activation-environment /
# systemctl --user import-environment - see hc.start.dbus_share_picker /
# hc.start.systemd_share_picker in Configs/.local/share/hypr/lua/
# variables.lua, and UWSM's DesktopNames=Hyprland in the hyprland.desktop
# entry, which is what actually sets XDG_CURRENT_DESKTOP=Hyprland here),
# NOT the environment of whatever process happened to trigger the D-Bus
# request. A failed ConditionEnvironment is a clean skip, not a failure -
# no restart loop, no start-limit-hit, and Plasma's own notification daemon
# is left completely untouched.
[Unit]
ConditionEnvironment=XDG_CURRENT_DESKTOP=Hyprland
