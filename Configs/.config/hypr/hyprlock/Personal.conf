# Security-first lockscreen: no periodic commands, network access or media widgets.
$fontFamily = CaskaydiaCove Nerd Font Mono

general {
    grace = 0
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = premium, 0.22, 1, 0.36, 1
    animation = fade, 1, 2.5, premium
    animation = inputFieldColors, 1, 2, premium
    animation = inputFieldDots, 1, 1.5, premium
}

background {
    monitor =
    path = $BACKGROUND_PATH
    blur_passes = 3
    blur_size = 8
    brightness = 0.45
    contrast = 1.05
    vibrancy = 0.10
}

label {
    monitor =
    text = $TIME
    color = rgba(EEF1F7FF)
    font_size = 86
    font_family = $fontFamily
    position = 0, 210
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_ALL=fr_FR.UTF-8 date '+%A %d %B'
    color = rgba(C8CFDCFF)
    font_size = 20
    font_family = $fontFamily
    position = 0, 145
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(EEF1F7FF)
    font_size = 22
    font_family = $fontFamily
    position = 0, 35
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 62
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    outer_color = rgba(9AA7C4CC)
    inner_color = rgba(161B2BCC)
    font_color = rgba(EEF1F7FF)
    fade_on_empty = false
    placeholder_text = <span foreground="#B8C0D0">$PAMPROMPT</span>
    hide_input = false
    rounding = 18
    check_color = rgba(89B4FAFF)
    check_text = Vérification…
    fail_color = rgba(F38BA8FF)
    fail_text = <b>$FAIL</b>  tentative $ATTEMPTS
    capslock_color = rgba(F9E2AFFF)
    numlock_color = rgba(94E2D5FF)
    bothlock_color = rgba(FAB387FF)
    swap_font_color = false
    position = 0, -45
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(B8C0D0FF)
    font_size = 15
    font_family = $fontFamily
    position = 0, -105
    halign = center
    valign = center
}
