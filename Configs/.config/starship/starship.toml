"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
scan_timeout = 30
command_timeout = 800
palette = "gruvbox_dark"

format = "[](color_orange)$os$username[](bg:color_yellow fg:color_orange)$directory[](fg:color_yellow bg:color_aqua)$git_branch$git_status[](fg:color_aqua)$fill$cmd_duration$status$time$line_break$character"

right_format = ""

[fill]
symbol = " "

[os]
disabled = false
style = "bg:color_orange fg:color_fg0"
format = "[ $symbol ]($style)"

[os.symbols]
Arch = ""
Linux = ""

[username]
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = "[$user ]($style)"

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[   $path ]($style)"
truncation_length = 4
truncate_to_repo = true
truncation_symbol = "…/"

[directory.substitutions]
Documents = "󰈙 "
Downloads = " "
Music = "󰝚 "
Pictures = " "
dev = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_aqua"
format = "[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)"

[git_state]
style = "yellow"
format = "[\\($state( $progress_current/$progress_total)\\)]($style) "

[git_status]
style = "fg:color_fg0 bg:color_aqua"
format = "[$all_status$ahead_behind ]($style)"
conflicted = " ${count} "
deleted = " ${count} "
modified = " ${count} "
staged = " ${count} "
renamed = " ${count} "
untracked = " ${count} "
stashed = " ${count} "
ahead = " ${count} "
behind = " ${count} "
diverged = " ${ahead_count}/${behind_count} "

[cmd_duration]
min_time = 1500
style = "color_yellow"
format = "[󰔟 $duration  ]($style)"

[status]
disabled = false
style = "color_red"
format = "[$symbol$status  ]($style)"
symbol = "󰅙 "

[character]
success_symbol = "[╰─❯](bold fg:color_green) "
error_symbol = "[╰─❯](bold fg:color_red) "
vimcmd_symbol = "[╰─❮](bold fg:color_aqua) "

[time]
disabled = false
time_format = "%H:%M"
format = "[](fg:color_bg1)[  $time ](fg:color_fg0 bg:color_bg1)[](fg:color_bg1)"

[rust]
symbol = "󱘗 "
style = "peach"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = "󰎙 "
style = "green"
format = "[$symbol($version )]($style)"

[bun]
symbol = "󰳮 "
style = "peach"
format = "[$symbol($version )]($style)"

[python]
symbol = "󰌠 "
style = "yellow"
format = "[$symbol($version)( \\($virtualenv\\)) ]($style)"

[package]
symbol = "󰏗 "
style = "mauve"
format = "[$symbol$version ]($style)"

[container]
symbol = "󰡨 "
style = "sapphire"
format = "[$symbol$name ]($style)"

[palettes.gruvbox_dark]
color_fg0 = "#fbf1c7"
color_bg1 = "#3c3836"
color_bg3 = "#665c54"
color_blue = "#458588"
color_aqua = "#689d6a"
color_green = "#98971a"
color_orange = "#d65d0e"
color_purple = "#b16286"
color_red = "#cc241d"
color_yellow = "#d79921"
