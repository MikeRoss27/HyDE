"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
scan_timeout = 30
command_timeout = 1000

# =============================================================================
# PROMPT
# =============================================================================

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$fill\
$sudo\
$battery\
$cmd_duration\
$status\
$line_break\
$character"""

# Tous les modules non utilisés à gauche peuvent apparaître contextuellement
# à droite. Plus besoin de maintenir une liste gigantesque à la main.
right_format = "$all"

# =============================================================================
# CORE
# =============================================================================

[fill]
symbol = " "

[os]
disabled = false
format = "[$symbol](bold blue) "

[username]
show_always = false
format = "[$user]($style) "
style_user = "bold cyan"
style_root = "bold red"

[hostname]
ssh_only = true
ssh_symbol = " "
format = "[$ssh_symbol$hostname]($style) "
style = "bold dimmed cyan"

[directory]
style = "bold blue"
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "bold red"

truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true

home_symbol = "~"

# Rend la racine d'un repo immédiatement identifiable.
repo_root_style = "bold cyan"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Desktop" = "󰇄 "
"dev" = "󰲋 "

# =============================================================================
# GIT
# =============================================================================

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch(:$remote_branch)]($style) "
truncation_length = 36
truncation_symbol = "…"

[git_commit]
tag_symbol = "  "
tag_disabled = false

only_detached = true
commit_hash_length = 7

format = "[ $hash$tag]($style) "
style = "yellow"

[git_state]
style = "bold yellow"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[git_status]
style = ""
format = "([$all_status$ahead_behind]($style) )"

# Rouge = problème
conflicted = "[=${count}](bold red) "
deleted = "[✘${count}](bold red) "

# Jaune = modifications locales
modified = "[!${count}](bold yellow) "
behind = "[⇣${count}](bold yellow) "

# Vert = prêt / staged
staged = "[+${count}](bold green) "

# Cyan = mouvement / synchronisation
ahead = "[⇡${count}](bold cyan) "
renamed = "[»${count}](bold cyan) "
stashed = "[*${count}](bold cyan) "

# Neutre
untracked = "[?${count}](dimmed white) "

# Cas spécial : divergence
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](bold purple) "

# =============================================================================
# COMMAND
# =============================================================================

[cmd_duration]
min_time = 1500
show_milliseconds = false
style = "yellow"
format = "[󰔟 $duration]($style) "

[status]
disabled = false

# Utilise les symboles spécialisés pour certains exit codes.
map_symbol = true

symbol = " "
success_symbol = ""

not_executable_symbol = "󰂭 "
not_found_symbol = "󰍉 "
sigint_symbol = "󰚌 "
signal_symbol = "󱑽 "

format = "[$symbol$status]($style) "
style = "bold red"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"

# =============================================================================
# SYSTEM
# =============================================================================

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

format = "[$symbol$percentage]($style) "

[[battery.display]]
threshold = 15
style = "bold red"

[[battery.display]]
threshold = 30
style = "bold yellow"

[memory_usage]
disabled = true
symbol = "󰍛 "

[sudo]
disabled = false
symbol = " "
format = "[$symbol]($style)"
style = "bold red"

[shlvl]
disabled = true
symbol = "󰹍 "

[jobs]
symbol = "󰜎 "
style = "bold dimmed cyan"

