# =============================================================================
# DEVOPS / CONTAINERS
# =============================================================================

[docker_context]
symbol = " "
style = "bold blue"
format = "[$symbol$context]($style) "
only_with_files = true

[container]
symbol = " "
style = "bold red"
format = "[$symbol$name]($style) "

[kubernetes]
symbol = "󱃾 "
style = "bold cyan"
format = '[$symbol$context( \($namespace\))]($style) '

disabled = false

# Kubernetes activé seulement quand le projet semble réellement l'utiliser.
# Sans ces règles, Starship l'affiche partout dès qu'il est activé.
detect_env_vars = ["KUBECONFIG"]

detect_files = [
  "kustomization.yaml",
  "kustomization.yml",
  "Chart.yaml",
  "helmfile.yaml",
  "helmfile.yml",
]

detect_folders = [
  "k8s",
  "kubernetes",
  "charts",
]

